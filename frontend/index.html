<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портал для врачей</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Экран авторизации -->
    <div id="auth-screen" class="screen active">
        <div class="auth-container">
            <h1>Портал для врачей</h1>

            <div id="login-form" class="auth-form active">
                <h2>Вход в систему</h2>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="login-username">Имя пользователя</label>
                        <input type="text" id="login-username" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Пароль</label>
                        <input type="password" id="login-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Войти</button>
                </form>
                <p class="auth-switch">
                    Нет аккаунта? <a href="#" onclick="showRegister()">Зарегистрироваться</a>
                </p>
            </div>

            <div id="register-form" class="auth-form">
                <h2>Регистрация</h2>
                <form onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label for="reg-username">Имя пользователя</label>
                        <input type="text" id="reg-username" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-full-name">ФИО</label>
                        <input type="text" id="reg-full-name" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-specialization">Специализация</label>
                        <input type="text" id="reg-specialization">
                    </div>
                    <div class="form-group">
                        <label for="reg-password">Пароль</label>
                        <input type="password" id="reg-password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                </form>
                <p class="auth-switch">
                    Уже есть аккаунт? <a href="#" onclick="showLogin()">Войти</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Главный экран -->
    <div id="main-screen" class="screen">
        <div class="header">
            <h1>Портал для врачей</h1>
            <div class="user-info">
                <span id="doctor-name"></span>
                <button onclick="logout()" class="btn btn-secondary">Выйти</button>
            </div>
        </div>

        <div class="content">
            <!-- Боковая панель -->
            <div class="sidebar">
                <button onclick="showPatientsList()" class="btn btn-primary btn-block">Список пациентов</button>
                <button onclick="showAddPatient()" class="btn btn-success btn-block">Добавить пациента</button>
            </div>

            <!-- Основной контент -->
            <div class="main-content">
                <!-- Список пациентов -->
                <div id="patients-list-view" class="view active">
                    <h2>Мои пациенты</h2>
                    <div id="patients-list"></div>
                </div>

                <!-- Добавление пациента -->
                <div id="add-patient-view" class="view">
                    <h2>Добавить пациента</h2>
                    <form onsubmit="handleAddPatient(event)">
                        <div class="form-group">
                            <label for="patient-name">ФИО пациента</label>
                            <input type="text" id="patient-name" required>
                        </div>
                        <div class="form-group">
                            <label for="patient-dob">Дата рождения</label>
                            <input type="date" id="patient-dob">
                        </div>
                        <div class="form-group">
                            <label for="patient-phone">Телефон</label>
                            <input type="tel" id="patient-phone">
                        </div>
                        <div class="form-group">
                            <label for="patient-email">Email</label>
                            <input type="email" id="patient-email">
                        </div>
                        <div class="form-group">
                            <label for="patient-history">Анамнез</label>
                            <textarea id="patient-history" rows="4"></textarea>
                        </div>
                        <button type="submit" class="btn btn-success">Добавить</button>
                        <button type="button" onclick="showPatientsList()" class="btn btn-secondary">Отмена</button>
                    </form>
                </div>

                <!-- Детали пациента -->
                <div id="patient-details-view" class="view">
                    <div id="patient-details"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
